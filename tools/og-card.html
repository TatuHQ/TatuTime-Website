<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(23,18,15,.12) 1px, transparent 1.6px) 0 0 / 24px 24px,
      radial-gradient(700px 480px at 88% 18%, rgba(106,182,220,.38), transparent 65%),
      #f6f0e4;
    color: #17120f;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 42px 60px 30px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand img { width: 46px; image-rendering: pixelated; }
  .word { font-size: 31px; font-weight: 800; letter-spacing: -1.6px; }
  .word strong { color: #14536f; }
  .eyebrow { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #14536f; margin-top: 26px; }
  h1 { font-size: 68px; line-height: .97; letter-spacing: -3.6px; font-weight: 800; margin-top: 12px; max-width: 780px; }
  h1 em { font-style: normal; display: inline-block; position: relative; }
  h1 em::after { content: ""; position: absolute; z-index: -1; left: -4px; right: -4px; bottom: 2px; height: 24px; background: #6ab6dc; transform: rotate(-1deg); }
  p.sub { margin-top: 18px; font-size: 21px; line-height: 1.4; color: #423a33; max-width: 720px; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #6a6057; border-top: 1px solid #b9a98f; padding-top: 14px; }
  .foot strong { color: #17120f; font-size: 17px; letter-spacing: -.3px; }
  .mark { position: absolute; right: 54px; top: 142px; width: 220px; image-rendering: pixelated; }
  .sticker { position: absolute; right: 196px; top: 330px; background: #6ab6dc; border: 2px solid #17120f; box-shadow: 4px 4px 0 #17120f; padding: 9px 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 800; font-size: 15px; transform: rotate(-6deg); }
</style>
</head>
<body>
  <div class="brand">
    <img src="../site/assets/brand/tatu.png" alt="">
    <span class="word">Tatu<strong>Time</strong></span>
  </div>

  <div>
    <div class="eyebrow">FREE · SELF-HOSTED · OPEN SOURCE</div>
    <h1>Your hours.<br>Your invoices.<br><em>Your server.</em></h1>
    <p class="sub">Simple timesheets and invoicing that stay on your hardware. No cloud. No telemetry. AI never sees your data.</p>
  </div>

  <div class="foot">
    <strong>tatutime.com</strong>
    <span>AGPL-3.0 · github.com/TatuHQ/TatuTime</span>
  </div>

  <img class="mark" src="../site/assets/brand/tatu.png" alt="">
  <span class="sticker">100% yours</span>
</body>
</html>
